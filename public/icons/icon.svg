<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="royalBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#7A0022" />
      <stop offset="100%" stop-color="#4A0012" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A" />
      <stop offset="50%" stop-color="#C5B358" />
      <stop offset="100%" stop-color="#998329" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle / squircle -->
  <rect width="512" height="512" rx="110" fill="url(#royalBg)" />
  
  <!-- Outer Gold Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4"/>

  <!-- Royal Crown Motif on top -->
  <g filter="url(#goldGlow)">
    <path d="M196 150 L256 110 L316 150 L300 170 L212 170 Z" fill="url(#goldGradient)" />
    <circle cx="196" cy="144" r="7" fill="#FFE28A" />
    <circle cx="256" cy="104" r="9" fill="#FFE28A" />
    <circle cx="316" cy="144" r="7" fill="#FFE28A" />
  </g>

  <!-- Central "S" Monogram in Luxury Serif -->
  <text x="256" y="335" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="210" 
        font-weight="700" 
        fill="url(#goldGradient)" 
        text-anchor="middle"
        filter="url(#goldGlow)">S</text>

  <!-- Subtitle / Brand text -->
  <text x="256" y="415" 
        font-family="'Montserrat', sans-serif" 
        font-size="28" 
        font-weight="600" 
        letter-spacing="10" 
        fill="#FAF7F2" 
        text-anchor="middle"
        opacity="0.95">SONAKSHI</text>

  <text x="256" y="445" 
        font-family="'Montserrat', sans-serif" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="6" 
        fill="url(#goldGradient)" 
        text-anchor="middle"
        opacity="0.9">COUTURE</text>
</svg>
